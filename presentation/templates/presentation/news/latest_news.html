{% load news_tags %}
{% load static %}


<section id="blogs" class="padding-medium position-relative">
    <div class="container">
      <div class="d-flex flex-wrap align-items-center justify-content-between">
        <div class="section-title">
          <h2 class="display-5 text-center fw-semibold">Latest News</h2>
        </div>
        <a href="{% url 'news:news_list' %}" class="btn btn-primary mt-md-3">View all news</a>
      </div>
      <div class="section-title">
      <p class="display-12 text-right fw-semibold">
        <a href="{% url 'news:news_feed' %}"> Subscribe to my RSS feed </a> </p>
      </div>
      <div class="post-grid row mt-5">
        {% for news_item in latest_news %}
        <div class="col-lg-4 col-md-6 col-sm-12 mb-5">
          <div class="card-item">
            <div class="card border-0 bg-transparent">
              <div class="card-image position-relative">
                  {% if news_item.main_image %}
                <img src="{{ news_item.main_image.url }}" alt="post-img" class="post-image img-fluid">
                  {% endif %}
              </div>
            </div>
            <div class="card-body p-0 mt-2">
              <span class="text-capitalize text-black-50">{{ news_item.publish|date:"d M Y" }}</span>
              <h5 class="mt-2">
                <a href="{{ news_item.get_absolute_url }}">{{ news_item.title }}</a>
              </h5>
            </div>
          </div>
        </div>
          {% empty %}
          <div class="section-title">
          <p class="display-5 text-center fw-semibold">Наразі немає опублікованих новин.</p>
        </div>
         {% endfor %}
      </div>

    </div>
      <img class="position-absolute bottom-0 start-0 z-n1 img-fluid" src="{% static 'presentation/img/pattern4.png' %}" alt="img">
</section>
